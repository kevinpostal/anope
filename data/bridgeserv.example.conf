/*
 * Example configuration file for BridgeServ.
 */

/*
 * BridgeServ is a pseudoclient, in the same sense as BotServ, HostServ, and the
 * other services. It is through this client that bridges between IRC channels
 * and Discord channels are managed.
 *
 * Bridges allow messages sent in an IRC channel to be relayed to a channel on
 * Discord and back. The bot operates using a single Discord connection and a
 * single bot token, and may be present in as many Discord servers (guilds) as
 * you like, of which any guild/channel pair may be bridged to an IRC channel.
 *
 * Discord users are represented on IRC as pseudo clients on a single juped
 * server (discord.bridged by default). Each Discord user gets a unique IRC
 * identity:
 *
 *   nick     = sanitised Discord display name (or username)
 *   ident    = hex prefix of the SHA-256 hash of their Discord UID, clamped
 *              to networkinfo:userlen
 *   host     = discord.bridged (the bridge server name)
 *
 * For example: iampaigeat!a1b2c3d4e5@discord.bridged
 *
 * If two Discord users share a display name across guilds, a suffix is
 * appended (_2, _3, ...) to keep the IRC nick unique. A single Discord user
 * is shared across all bridges, so they appear as one IRC client joined to
 * every channel they are active in. Pseudo clients appear when their Discord
 * user speaks and are quit again once they have been idle for useridle.
 *
 * When messages are relayed from IRC to Discord, the Discord bot uses a
 * webhook per channel so that each IRC user's messages appear under their
 * own nick on Discord. If webhook creation fails (e.g. insufficient
 * permissions), the fallback is the bot account with a "<nick> message"
 * prefix. Messages relayed from IRC never ping anybody on Discord: the
 * allowed mentions of every relayed message are empty, so text like
 * "@everyone" is delivered as plain text.
 */
service
{
	/* The name of the BridgeServ client. */
	nick = "BridgeServ"

	/* The username of the BridgeServ client. */
	user = "services"

	/* The hostname of the BridgeServ client. */
	host = "${services.host}"

	/* The realname of the BridgeServ client. */
	real = "Bridge Service"

	/* The modes this client should use. */
	#modes = "+i"

	/*
	 * The server alias that can be used to securely message this service. If
	 * your IRC server does not have an alias for this service you can set this
	 * to an empty string to tell users to use /msg instead.
	 *
	 * This setting is ignored when options:servicealias is disabled.
	 *
	 * Defaults to the nick of the service if not set.
	 */
	#alias = "BS"
}

/*
 * Core BridgeServ module.
 *
 * Provides the functionality to discover the guilds and channels the Discord
 * bot is present in, and to create, modify, and delete bridges between IRC
 * channels and Discord channels from IRC.
 *
 * This module requires the vendored C++ Discord library (DPP) which is built
 * as part of Anope. DPP is in turn linked against OpenSSL and zlib, which must
 * be available on the build system. If DPP was not built or built without
 * OpenSSL or zlib support this module will fail to load.
 *
 * A single Discord bot token is supplied; the bot account this token belongs
 * to must be invited to each Discord server you want to bridge. The message
 * content intent must be enabled on the Discord application for message
 * content from the bot's guilds to be received, and the bot needs the
 * "Manage Webhooks" permission in each bridged channel for per-user identity.
 *
 * Discord message formatting is converted to IRC formatting (bold, italics,
 * underline, strikethrough, spoilers, and monospace), mentions and custom
 * emoji are rendered as names rather than numeric ids, and attachments,
 * stickers, and replies are annotated. Only message traffic is relayed;
 * joins, parts, presence, reactions, and typing are not.
 *
 * Messages sent by other services on a bridged IRC channel and the webhook
 * echo of this module's own messages are never relayed, to prevent relay
 * loops. Messages from other Discord bots are relayed.
 *
 * Note that the configuration of a bridge, including its webhook token, is
 * stored (unencrypted) in the Anope database. Only allow IRC operators to
 * manage these.
 */
module
{
	name = "bridgeserv"

	/*
	 * The name of the client that should be BridgeServ.
	 *
	 * This directive is optional.
	 */
	client = "BridgeServ"

	/*
	 * The Discord bot token used to connect to Discord. This is the one token
	 * that all bridges share. If this is not set then the Discord link is
	 * disabled and the module only manages its stored bridges.
	 */
	token = "replace-me"

	/*
	 * The name of the juped IRC server used to host Discord pseudo clients.
	 * Discord users appear to be connected to this server. This server is
	 * created automatically on the first bridge relay.
	 *
	 * Defaults to "discord.bridged" if not set. Changing this while bridges
	 * are active quits every pseudo client.
	 *
	 * This directive is optional.
	 */
	#server = "discord.bridged"

	/*
	 * The length of time a Discord pseudo client may be idle on IRC before it
	 * is quit. The client is recreated the next time the Discord user speaks.
	 * Set to 0 to keep pseudo clients on IRC forever.
	 *
	 * Defaults to 1h if not set.
	 *
	 * This directive is optional.
	 */
	#useridle = "1h"

	/*
	 * The maximum number of lines of a single Discord message to relay to
	 * IRC. Longer messages are truncated with a notice saying how many lines
	 * were dropped.
	 *
	 * Defaults to 8 if not set.
	 *
	 * This directive is optional.
	 */
	#maxlines = 8

	/*
	 * The relay throttle: at most floodlines lines may be relayed from Discord
	 * to an IRC channel in a burst, after which one more line may be relayed
	 * every floodsecs. Lines which do not fit are dropped, and a single notice
	 * reports how many were dropped. Set floodlines to 0 to disable the
	 * throttle entirely (not recommended on a busy guild).
	 *
	 * Default to 6 lines and 4s if not set.
	 *
	 * These directives are optional.
	 */
	#floodlines = 6
	#floodsecs = "4s"

	/*
	 * Whether to relay Discord message edits to IRC. Edits are relayed with
	 * an "(edit)" prefix, and only when the rendered message actually changed.
	 *
	 * Defaults to yes if not set.
	 *
	 * This directive is optional.
	 */
	#relayedits = yes

	/*
	 * Whether to relay Discord message deletions to IRC as a notice. Only
	 * messages which were relayed by this module are reported.
	 *
	 * Defaults to no if not set.
	 *
	 * This directive is optional.
	 */
	#relaydeletes = no

	/*
	 * The name of the Discord webhook used for relaying IRC messages. An
	 * existing webhook with this name in a bridged channel is reused, which
	 * keeps the module from creating a new webhook on every restart.
	 *
	 * Defaults to "IRC Bridge" if not set.
	 *
	 * This directive is optional.
	 */
	#bridgename = "IRC Bridge"

	/*
	 * The suffix appended to the nick of an IRC user when their message is
	 * relayed to Discord, so that IRC users can be told apart from Discord
	 * users with the same name.
	 *
	 * Defaults to " (IRC)" if not set.
	 *
	 * This directive is optional.
	 */
	#webhooksuffix = " (IRC)"
}

/*
 * The commands of BridgeServ. Bridges are network configuration, so every
 * command requires a permission; the defaults below give them to the same
 * operators who may jupe a server.
 */

/* Give it a help command. */
command { service = "BridgeServ"; name = "HELP"; command = "generic/help" }

/*
 * ADD
 *
 * Creates a bridge between an IRC channel and a Discord channel. The guild
 * and channel are given by their ids, as shown by GUILDS and CHANNELS.
 * BridgeServ joins the IRC channel automatically.
 */
command { service = "BridgeServ"; name = "ADD"; command = "bridgeserv/add"; permission = "bridgeserv/add" }

/*
 * SET
 *
 * Re-points an existing bridge at a different Discord guild and channel. The
 * webhook of the old channel is deleted.
 */
command { service = "BridgeServ"; name = "SET"; command = "bridgeserv/set"; permission = "bridgeserv/set" }

/*
 * DEL
 *
 * Removes an existing bridge and deletes its Discord webhook. Pseudo clients
 * for Discord users are removed from the channel but remain on IRC for any
 * other bridge they are active in.
 */
command { service = "BridgeServ"; name = "DEL"; command = "bridgeserv/del"; permission = "bridgeserv/del" }

/*
 * LIST
 *
 * Lists all configured bridges and whether the Discord link is up.
 */
command { service = "BridgeServ"; name = "LIST"; command = "bridgeserv/list"; permission = "bridgeserv/list" }

/*
 * GUILDS
 *
 * Lists the Discord servers (guilds) the bot is present in, as "name (id)".
 */
command { service = "BridgeServ"; name = "GUILDS"; command = "bridgeserv/guilds"; permission = "bridgeserv/guilds" }

/*
 * CHANNELS
 *
 * Lists the text channels of the given guild as "name (id)". The guild is
 * given by its id, as shown by GUILDS.
 */
command { service = "BridgeServ"; name = "CHANNELS"; command = "bridgeserv/channels"; permission = "bridgeserv/channels" }
